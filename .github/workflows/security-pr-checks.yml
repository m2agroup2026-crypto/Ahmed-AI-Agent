name: Security PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authentication-security:
    name: Authentication and signing security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out PR merge revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Select reviewed security test dependencies
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import re

          # Use the root production manifest, not the conflicting backend freeze.
          # Install only dependencies needed by the scoped tests and app imports.
          required = {
              "fastapi", "starlette", "pydantic", "email-validator",
              "sqlalchemy", "bcrypt", "passlib", "python-jose",
              "cryptography", "httpx", "anyio", "openai", "azure-identity",
          }
          # These two entries are unpinned in the application manifest. Constrain
          # them to the versions used by the locally verified Python 3.14 tests.
          unpinned_versions = {"openai": "3.24.0", "azure-identity": "1.26.0"}
          selected = {}
          for raw in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.fullmatch(
                  r"([A-Za-z0-9_-]+)(\[[A-Za-z0-9_,.-]+\])?(?:==([A-Za-z0-9_.+!-]+))?",
                  line,
              )
              if not match:
                  raise SystemExit("Unsupported requirement syntax; review manifest")
              name, extras, version = match.groups()
              canonical = name.lower().replace("_", "-")
              if canonical not in required:
                  continue
              if canonical in selected:
                  raise SystemExit("Duplicate security dependency in manifest")
              if version is None:
                  version = unpinned_versions.get(canonical)
              if version is None:
                  raise SystemExit("Security dependencies must use exact versions")
              selected[canonical] = f"{name}{extras or ''}=={version}"
          if set(selected) != required:
              raise SystemExit("Required security dependency missing from manifest")
          # pytest is absent from application manifests; pin the test runner here
          # so this CI-only change does not alter production dependencies.
          requirements = [selected[name] for name in sorted(selected)] + ["pytest==9.1.1"]
          destination = Path(os.environ["RUNNER_TEMP"]) / "aqlith-security-requirements.txt"
          destination.write_text("\n".join(requirements) + "\n", encoding="utf-8")
          PY

      - name: Install scoped test dependencies
        run: |
          python -m pip --isolated install \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --disable-pip-version-check --no-input \
            -r "$RUNNER_TEMP/aqlith-security-requirements.txt"

      - name: Run isolated authentication and signing checks
        working-directory: nexora_backend
        run: |
          python -B - <<'PY'
          import os
          import secrets

          # Never export the key to GITHUB_ENV, an artifact, or a deployment job.
          os.environ["SECRET_KEY"] = secrets.token_urlsafe(48)
          os.environ["DATABASE_URL"] = "sqlite://"
          os.environ["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"
          os.environ.pop("PYTEST_ADDOPTS", None)
          os.environ.pop("PYTEST_PLUGINS", None)
          import pytest

          # Explicit allowlist: do not collect historical-secret or live-provider tests.
          tests = [
              "app/tests/test_auth_security.py",
              "app/tests/test_signing_configuration.py",
              "app/tests/tutor/test_tutor_api.py::test_session_is_not_visible_to_another_authenticated_user",
              "app/tests/tutor/test_tutor_api.py::test_message_uses_jwt_identity_and_ignores_client_user_id",
              "app/tests/tutor/test_tutor_api.py::test_message_rejects_bad_jwt_without_inference",
              "app/tests/tutor/test_tutor_api.py::test_message_checks_user_and_session_before_inference",
              "app/tests/tutor/test_tutor_api.py::test_curriculum_import_requires_platform_permission",
          ]
          raise SystemExit(pytest.main(tests + [
              "-q", "-p", "no:cacheprovider", "-o", "addopts=",
              "--confcutdir=app/tests", "--tb=short",
          ]))
          PY
